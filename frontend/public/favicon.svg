<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1228" />
      <stop offset="100%" stop-color="#03060d" />
    </radialGradient>
    
    <!-- Cyber Neon Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    
    <linearGradient id="cyberYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <!-- Hologram Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyber Hexagon Outer Badge -->
  <polygon points="64,6 118,34 118,94 64,122 10,94 10,34" fill="url(#bgGlow)" stroke="#00f2fe" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Circuit Nodes -->
  <line x1="64" y1="6" x2="64" y2="24" stroke="#ff007f" stroke-width="2" />
  <circle cx="64" cy="24" r="3" fill="#ff007f" filter="url(#glow)" />
  <line x1="118" y1="34" x2="100" y2="44" stroke="#00f2fe" stroke-width="1.5" />
  <circle cx="100" cy="44" r="2.5" fill="#00f2fe" />
  <line x1="10" y1="94" x2="28" y2="84" stroke="#00f2fe" stroke-width="1.5" />
  <circle cx="28" cy="84" r="2.5" fill="#00f2fe" />

  <!-- 3D Isometric Cube / Core -->
  <!-- Top Face -->
  <polygon points="64,28 92,44 64,60 36,44" fill="#00f2fe" opacity="0.85" />
  <!-- Left Face -->
  <polygon points="36,44 64,60 64,96 36,80" fill="url(#neonPink)" opacity="0.9" />
  <!-- Right Face -->
  <polygon points="64,60 92,44 92,80 64,96" fill="url(#neonCyan)" opacity="0.9" />

  <!-- Center Hologram "EL" Typography -->
  <text x="64" y="72" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1" filter="url(#glow)">EL</text>

  <!-- Accent Crosshair Accents -->
  <line x1="16" y1="64" x2="26" y2="64" stroke="#ffe600" stroke-width="2" />
  <line x1="102" y1="64" x2="112" y2="64" stroke="#ffe600" stroke-width="2" />
</svg>
